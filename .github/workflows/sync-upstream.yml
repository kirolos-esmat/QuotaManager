name: Sync Upstream

"on":
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    steps:
      - name: Synchronize Upstream Branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import os
          import sys
          import json
          import urllib.request
          import urllib.error

          def sync_fork():
              repo = os.environ.get("GITHUB_REPOSITORY")
              token = os.environ.get("GITHUB_TOKEN")
              step_summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
              target_branch = "main"

              if not repo or not token:
                  print("::error::Missing GITHUB_REPOSITORY or GITHUB_TOKEN environment variables.")
                  sys.exit(1)

              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "sync-upstream-action",
              }

              def api_call(endpoint, method="GET", data=None):
                  clean_ep = endpoint.lstrip("/")
                  url = f"https://api.github.com/{clean_ep}"
                  req = urllib.request.Request(url, headers=headers, method=method)
                  if data is not None:
                      req.data = json.dumps(data).encode("utf-8")
                      req.add_header("Content-Type", "application/json")
                  try:
                      with urllib.request.urlopen(req) as resp:
                          body = resp.read().decode("utf-8")
                          return resp.status, json.loads(body) if body else {}
                  except urllib.error.HTTPError as e:
                      body = e.read().decode("utf-8")
                      try:
                          return e.code, json.loads(body)
                      except Exception:
                          return e.code, {"message": body}
                  except Exception as e:
                      return 0, {"message": str(e)}

              def write_summary(lines):
                  text = "\n".join(lines) + "\n"
                  print(text)
                  if step_summary_file and os.path.exists(os.path.dirname(step_summary_file)):
                      try:
                          with open(step_summary_file, "a", encoding="utf-8") as f:
                              f.write(text)
                      except Exception as e:
                          print(f"::warning::Failed to write step summary: {e}")

              # 1. Fetch Repository Metadata
              st, repo_data = api_call(f"repos/{repo}")
              if st != 200:
                  msg = repo_data.get("message", "Unknown error")
                  write_summary([
                      "## Upstream Sync",
                      "",
                      f"**Repository:** `{repo}`",
                      "**Status:** `FAILED`",
                      "",
                      f"Failed to fetch repository metadata: {msg}"
                  ])
                  print(f"::error::Failed to fetch repository metadata: {msg}")
                  sys.exit(1)

              if not repo_data.get("fork"):
                  write_summary([
                      "## Upstream Sync",
                      "",
                      f"**Repository:** `{repo}`",
                      "**Status:** `NOT A FORK`",
                      "",
                      "This repository is not configured as a GitHub fork. Upstream synchronization stopped."
                  ])
                  print("::error::Repository is not a fork.")
                  sys.exit(1)

              parent_info = repo_data.get("parent")
              if not parent_info:
                  write_summary([
                      "## Upstream Sync",
                      "",
                      f"**Repository:** `{repo}`",
                      "**Status:** `FAILED`",
                      "",
                      "Could not determine parent repository metadata."
                  ])
                  print("::error::Could not determine parent repository metadata.")
                  sys.exit(1)

              parent_full = parent_info["full_name"]
              parent_owner = parent_info["owner"]["login"]

              # 2. Check upstream branch exists
              st, upstream_branch = api_call(f"repos/{parent_full}/branches/{target_branch}")
              if st != 200:
                  write_summary([
                      "## Upstream Sync",
                      "",
                      f"**Repository:** `{repo}`",
                      f"**Upstream:** `{parent_full}`",
                      f"**Branch:** `{target_branch}`",
                      "",
                      "**Status:** `FAILED`",
                      "",
                      f"Upstream branch `{target_branch}` not found in `{parent_full}`."
                  ])
                  print(f"::error::Upstream branch {target_branch} does not exist in {parent_full}.")
                  sys.exit(1)
              upstream_sha = upstream_branch["commit"]["sha"]

              # 3. Check fork branch exists
              st, fork_branch = api_call(f"repos/{repo}/branches/{target_branch}")
              if st != 200:
                  write_summary([
                      "## Upstream Sync",
                      "",
                      f"**Repository:** `{repo}`",
                      f"**Upstream:** `{parent_full}`",
                      f"**Branch:** `{target_branch}`",
                      "",
                      "**Status:** `FAILED`",
                      "",
                      f"Fork branch `{target_branch}` not found in `{repo}`."
                  ])
                  print(f"::error::Fork branch {target_branch} does not exist in {repo}.")
                  sys.exit(1)
              fork_sha = fork_branch["commit"]["sha"]

              # 4. Compare upstream with fork
              st, cmp_data = api_call(f"repos/{repo}/compare/{parent_owner}:{target_branch}...{target_branch}")
              if st != 200:
                  msg = cmp_data.get("message", "Unknown error")
                  write_summary([
                      "## Upstream Sync",
                      "",
                      f"**Repository:** `{repo}`",
                      f"**Upstream:** `{parent_full}`",
                      f"**Branch:** `{target_branch}`",
                      "",
                      "**Status:** `FAILED`",
                      "",
                      f"Failed to compare branches: {msg}"
                  ])
                  print(f"::error::Failed to compare branches: {msg}")
                  sys.exit(1)

              status = cmp_data.get("status")
              ahead_by = cmp_data.get("ahead_by", 0)
              behind_by = cmp_data.get("behind_by", 0)

              # STATE 1: UP TO DATE
              if status == "identical" or (ahead_by == 0 and behind_by == 0):
                  write_summary([
                      "## Upstream Sync",
                      "",
                      f"**Repository:** `{repo}`",
                      f"**Upstream:** `{parent_full}`",
                      f"**Branch:** `{target_branch}`",
                      "",
                      "**Status:** `UP TO DATE`",
                      "",
                      "The fork already matches upstream/main.",
                      "No changes were made."
                  ])
                  print("Fork is already up to date.")
                  sys.exit(0)

              # STATE 2: FORK BEHIND
              elif status == "behind" or (ahead_by == 0 and behind_by > 0):
                  print(f"Fork is behind upstream by {behind_by} commit(s). Synchronizing safely...")
                  st_merge, merge_resp = api_call(f"repos/{repo}/merge-upstream", method="POST", data={"branch": target_branch})
                  if st_merge == 200:
                      _, updated_branch = api_call(f"repos/{repo}/branches/{target_branch}")
                      new_sha = updated_branch.get("commit", {}).get("sha", "unknown")
                      write_summary([
                          "## Upstream Sync",
                          "",
                          f"**Repository:** `{repo}`",
                          f"**Upstream:** `{parent_full}`",
                          f"**Branch:** `{target_branch}`",
                          "",
                          "**Status:** `SYNCED`",
                          "",
                          f"- **Previous fork commit:** `{fork_sha[:7]}`",
                          f"- **New fork commit:** `{new_sha[:7]}`",
                          f"- **Commits synchronized:** {behind_by}",
                          "",
                          "Upstream contained new commits.",
                          "Fork successfully synchronized."
                      ])
                      print("Upstream contained new commits. Fork successfully synchronized.")
                      sys.exit(0)
                  else:
                      err_msg = merge_resp.get("message", "Unknown merge error")
                      write_summary([
                          "## Upstream Sync",
                          "",
                          f"**Repository:** `{repo}`",
                          f"**Upstream:** `{parent_full}`",
                          f"**Branch:** `{target_branch}`",
                          "",
                          "**Status:** `SYNC FAILED`",
                          "",
                          f"Automatic synchronization failed: {err_msg}"
                      ])
                      print(f"::error::Merge upstream failed: {err_msg}")
                      sys.exit(1)

              # STATE 3: FORK AHEAD
              elif status == "ahead" or (ahead_by > 0 and behind_by == 0):
                  commit_lines = []
                  for c in cmp_data.get("commits", [])[:10]:
                      c_sha = c.get("sha", "")[:7]
                      c_msg = c.get("commit", {}).get("message", "").splitlines()[0]
                      commit_lines.append(f"- `{c_sha}` {c_msg}")

                  write_summary([
                      "## Upstream Sync",
                      "",
                      f"**Repository:** `{repo}`",
                      f"**Upstream:** `{parent_full}`",
                      f"**Branch:** `{target_branch}`",
                      "",
                      "**Status:** `MANUAL INTERVENTION REQUIRED`",
                      "",
                      f"The fork contains {ahead_by} custom commit(s) not present in upstream.",
                      "",
                      f"- **Fork commit:** `{fork_sha[:7]}`",
                      f"- **Upstream commit:** `{upstream_sha[:7]}`",
                      "",
                      "### Unique Fork Commits",
                      *commit_lines,
                      "",
                      "No changes were made.",
                      "No force push was performed."
                  ])
                  print("The fork contains custom commits. Marking manual intervention required.")
                  sys.exit(0)

              # STATE 4: DIVERGED
              elif status == "diverged" or (ahead_by > 0 and behind_by > 0):
                  write_summary([
                      "## Upstream Sync",
                      "",
                      f"**Repository:** `{repo}`",
                      f"**Upstream:** `{parent_full}`",
                      f"**Branch:** `{target_branch}`",
                      "",
                      "**Status:** `DIVERGED`",
                      "",
                      f"The fork and upstream contain different commits (ahead by {ahead_by}, behind by {behind_by}).",
                      "",
                      f"- **Fork commit:** `{fork_sha[:7]}`",
                      f"- **Upstream commit:** `{upstream_sha[:7]}`",
                      "",
                      "Automatic synchronization was intentionally stopped.",
                      "Manual merge/reconciliation is required."
                  ])
                  print("::warning::The fork and upstream contain different commits. Automatic sync stopped.")
                  sys.exit(0)

              else:
                  write_summary([
                      "## Upstream Sync",
                      "",
                      f"**Repository:** `{repo}`",
                      f"**Upstream:** `{parent_full}`",
                      f"**Branch:** `{target_branch}`",
                      "",
                      f"**Status:** `UNKNOWN ({status})`",
                      "",
                      "Unrecognized comparison status."
                  ])
                  sys.exit(1)

          sync_fork()
          EOF
