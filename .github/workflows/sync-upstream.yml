name: Sync Upstream

"on":
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  sync:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    outputs:
      synced: ${{ steps.sync_step.outputs.synced }}
    steps:
      - name: Checkout Fork Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Synchronize Upstream Branch and Releases
        id: sync_step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_OUTPUT: ${{ github.output }}
        run: |
          python3 - << 'EOF'
          import os
          import sys
          import json
          import subprocess
          import urllib.request
          import urllib.error

          def run_cmd(cmd, check=True):
              res = subprocess.run(cmd, shell=True, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if check and res.returncode != 0:
                  raise subprocess.CalledProcessError(res.returncode, cmd, res.stdout, res.stderr)
              return res.returncode, res.stdout.strip(), res.stderr.strip()

          def set_output(name, value):
              output_file = os.environ.get("GITHUB_OUTPUT")
              if output_file:
                  try:
                      with open(output_file, "a", encoding="utf-8") as f:
                          f.write(f"{name}={value}\n")
                  except Exception as e:
                      print(f"::warning::Failed to write output {name}: {e}")

          def sync_fork():
              repo = os.environ.get("GITHUB_REPOSITORY")
              token = os.environ.get("GITHUB_TOKEN")
              step_summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
              target_branch = "main"

              if not repo or not token:
                  print("::error::Missing GITHUB_REPOSITORY or GITHUB_TOKEN environment variables.")
                  set_output("synced", "false")
                  sys.exit(1)

              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "sync-upstream-action",
              }

              def api_call(endpoint, method="GET", data=None):
                  clean_ep = endpoint.lstrip("/")
                  url = f"https://api.github.com/{clean_ep}"
                  req = urllib.request.Request(url, headers=headers, method=method)
                  if data is not None:
                      req.data = json.dumps(data).encode("utf-8")
                      req.add_header("Content-Type", "application/json")
                  try:
                      with urllib.request.urlopen(req) as resp:
                          body = resp.read().decode("utf-8")
                          return resp.status, json.loads(body) if body else {}
                  except urllib.error.HTTPError as e:
                      body = e.read().decode("utf-8")
                      try:
                          return e.code, json.loads(body)
                      except Exception:
                          return e.code, {"message": body}
                  except Exception as e:
                      return 0, {"message": str(e)}

              def write_summary(lines):
                  text = "\n".join(lines) + "\n"
                  print(text)
                  if step_summary_file and os.path.exists(os.path.dirname(step_summary_file)):
                      try:
                          with open(step_summary_file, "a", encoding="utf-8") as f:
                              f.write(text)
                      except Exception as e:
                          print(f"::warning::Failed to write step summary: {e}")

              # 1. Fetch Dynamic Parent Repository Metadata from GitHub API
              st, repo_data = api_call(f"repos/{repo}")
              if st != 200:
                  msg = repo_data.get("message", "Unknown error")
                  write_summary([
                      "## Upstream Sync",
                      "",
                      f"**Repository:** `{repo}`",
                      "**Status:** `FAILED`",
                      "",
                      f"Failed to fetch repository metadata: {msg}"
                  ])
                  set_output("synced", "false")
                  sys.exit(1)

              if not repo_data.get("fork"):
                  write_summary([
                      "## Upstream Sync",
                      "",
                      f"**Repository:** `{repo}`",
                      "**Status:** `NOT A FORK`",
                      "",
                      "This repository is not configured as a GitHub fork. Upstream synchronization stopped."
                  ])
                  print("::error::Repository is not a fork.")
                  set_output("synced", "false")
                  sys.exit(1)

              parent_info = repo_data.get("parent")
              if not parent_info:
                  write_summary([
                      "## Upstream Sync",
                      "",
                      f"**Repository:** `{repo}`",
                      "**Status:** `FAILED`",
                      "",
                      "Could not determine parent repository metadata."
                  ])
                  set_output("synced", "false")
                  sys.exit(1)

              parent_full = parent_info["full_name"]

              # 2. Add Upstream Remote and Fetch Branch + Tags
              run_cmd(f"git remote add upstream https://github.com/{parent_full}.git || git remote set-url upstream https://github.com/{parent_full}.git")
              run_cmd(f"git fetch --tags upstream {target_branch}")
              run_cmd("git push origin --tags", check=False)

              # 3. Sync GitHub Releases from Upstream
              new_releases_synced = 0
              try:
                  st_up, up_releases = api_call(f"repos/{parent_full}/releases")
                  st_fork, fork_releases = api_call(f"repos/{repo}/releases")
                  if st_up == 200 and st_fork == 200 and isinstance(up_releases, list) and isinstance(fork_releases, list):
                      existing_tags = {r.get("tag_name") for r in fork_releases}
                      for r in up_releases:
                          tag = r.get("tag_name")
                          if tag and tag not in existing_tags and not r.get("draft"):
                              print(f"Mirroring upstream release {tag} to fork...")
                              st_post, _ = api_call(f"repos/{repo}/releases", method="POST", data={
                                  "tag_name": tag,
                                  "name": r.get("name") or tag,
                                  "body": r.get("body") or "",
                                  "draft": False,
                                  "prerelease": r.get("prerelease", False)
                              })
                              if st_post in (200, 201):
                                  new_releases_synced += 1
              except Exception as e:
                  print(f"::warning::Failed to sync releases: {e}")

              # 4. Inspect Commit Relationship
              _, fork_sha, _ = run_cmd("git rev-parse HEAD")
              _, upstream_sha, _ = run_cmd(f"git rev-parse upstream/{target_branch}")

              _, behind_str, _ = run_cmd(f"git rev-list --count HEAD..upstream/{target_branch}")
              _, ahead_str, _ = run_cmd(f"git rev-list --count upstream/{target_branch}..HEAD")
              behind_count = int(behind_str)
              ahead_count = int(ahead_str)

              print(f"Sync check: upstream={parent_full}:{target_branch} (behind={behind_count}, ahead={ahead_count}, new_releases={new_releases_synced})")

              # CASE 1: Fork is already up to date with upstream
              if behind_count == 0:
                  msg = "The fork already matches upstream/main." if ahead_count == 0 else f"The fork is fully up to date with upstream/main (contains {ahead_count} local custom commit(s))."
                  write_summary([
                      "## Upstream Sync",
                      "",
                      f"**Repository:** `{repo}`",
                      f"**Upstream:** `{parent_full}`",
                      f"**Branch:** `{target_branch}`",
                      "",
                      "**Status:** `UP TO DATE`",
                      "",
                      msg,
                      "Releases and tags synchronized. No branch changes needed."
                  ])
                  print("Fork is already up to date with upstream.")
                  if new_releases_synced > 0:
                      set_output("synced", "true")
                  else:
                      set_output("synced", "false")
                  sys.exit(0)

              # CASE 2: Fork is clean & behind upstream -> Fast-Forward Merge
              elif ahead_count == 0 and behind_count > 0:
                  print(f"Fork is cleanly behind upstream by {behind_count} commit(s). Fast-forwarding...")
                  run_cmd(f"git merge --ff-only upstream/{target_branch}")
                  run_cmd(f"git push origin {target_branch}")
                  _, new_sha, _ = run_cmd("git rev-parse HEAD")
                  write_summary([
                      "## Upstream Sync",
                      "",
                      f"**Repository:** `{repo}`",
                      f"**Upstream:** `{parent_full}`",
                      f"**Branch:** `{target_branch}`",
                      "",
                      "**Status:** `SYNCED (FAST-FORWARD)`",
                      "",
                      f"- **Previous fork commit:** `{fork_sha[:7]}`",
                      f"- **New fork commit:** `{new_sha[:7]}`",
                      f"- **Commits synchronized:** {behind_count}",
                      "",
                      "Fork successfully fast-forwarded to upstream."
                  ])
                  print("Fast-forward merge pushed successfully.")
                  set_output("synced", "true")
                  sys.exit(0)

              # CASE 3: Fork has custom commits & upstream has new commits -> Automatic Safe Merge
              else:
                  print(f"Fork has {ahead_count} custom commit(s) and is behind upstream by {behind_count} commit(s). Attempting auto-merge...")
                  
                  # List upstream new commits
                  _, upstream_commits, _ = run_cmd(f"git log --oneline HEAD..upstream/{target_branch} -n 10")
                  commit_list = [f"- `{line}`" for line in upstream_commits.splitlines()]

                  # Attempt non-conflicting merge
                  merge_code, merge_out, merge_err = run_cmd(
                      f'git merge --no-edit -m "ci: auto-sync with upstream {parent_full}" upstream/{target_branch}',
                      check=False
                  )

                  if merge_code == 0:
                      # Push merge commit
                      run_cmd(f"git push origin {target_branch}")
                      _, new_sha, _ = run_cmd("git rev-parse HEAD")

                      write_summary([
                          "## Upstream Sync",
                          "",
                          f"**Repository:** `{repo}`",
                          f"**Upstream:** `{parent_full}`",
                          f"**Branch:** `{target_branch}`",
                          "",
                          "**Status:** `SYNCED (AUTO-MERGED)`",
                          "",
                          f"- **Previous fork commit:** `{fork_sha[:7]}`",
                          f"- **New merge commit:** `{new_sha[:7]}`",
                          f"- **Commits integrated from upstream:** {behind_count}",
                          "",
                          "### Integrated Upstream Commits",
                          *commit_list,
                          "",
                          "Upstream changes were automatically merged into fork without conflicts."
                      ])
                      print("Auto-merge succeeded and pushed to fork.")
                      set_output("synced", "true")
                      sys.exit(0)
                  else:
                      # Conflict detected -> abort safely
                      run_cmd("git merge --abort", check=False)
                      write_summary([
                          "## Upstream Sync",
                          "",
                          f"**Repository:** `{repo}`",
                          f"**Upstream:** `{parent_full}`",
                          f"**Branch:** `{target_branch}`",
                          "",
                          "**Status:** `MERGE CONFLICT - MANUAL RESOLUTION REQUIRED`",
                          "",
                          f"Automatic merge failed due to merge conflicts between fork and upstream ({parent_full}).",
                          "",
                          "- The working tree was left completely untouched.",
                          "- No force push was performed.",
                          "- Please resolve conflicts manually locally and push to main.",
                          "",
                          "### Upstream Commits to Integrate",
                          *commit_list
                      ])
                      print("::warning::Merge conflict detected between upstream and fork. Auto-merge aborted safely.")
                      set_output("synced", "false")
                      sys.exit(0)

          sync_fork()
          EOF

  publish-docker:
    name: Build & Publish Docker Image
    needs: sync
    if: needs.sync.outputs.synced == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      ref: main
